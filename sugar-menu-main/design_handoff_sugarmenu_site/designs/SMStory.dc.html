<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ stack }}" hint-placeholder-val="{{ true }}">
  <article style="display:flex;flex-direction:column;gap:10px">
    <sc-if value="{{ hasShot }}" hint-placeholder-val="{{ true }}"><dc-import name="SMPh" label="{{ shot }}" ratio="{{ ratio }}" tone="{{ tone }}" hint-size="100%,180px"></dc-import></sc-if>
    <span style="font:600 10px/1.2 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C23A68;margin-top:6px">{{ kicker }}</span>
    <h3 style="margin:0;font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:{{ ts }};line-height:1.14;color:#2A0910;text-wrap:balance">{{ title }}</h3>
    <sc-if value="{{ hasEx }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-family:'Libre Caslon Text',Georgia,serif;font-size:{{ es }};line-height:1.6;color:#5B4248;text-wrap:pretty">{{ excerpt }}</p></sc-if>
    <sc-if value="{{ hasBy }}" hint-placeholder-val="{{ false }}"><span style="font:500 11px/1 'Jost',sans-serif;letter-spacing:.06em;color:#7A5F65">{{ byline }}</span></sc-if>
    <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ false }}"><a href="#" style="font:600 10.5px/1 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C23A68;margin-top:4px">Read more →</a></sc-if>
  </article>
</sc-if>
<sc-if value="{{ row }}" hint-placeholder-val="{{ false }}">
  <article style="display:flex;gap:18px;align-items:flex-start">
    <div style="flex:none;width:{{ tw }}"><dc-import name="SMPh" label="{{ shot }}" ratio="{{ ratio }}" tone="{{ tone }}" hint-size="100%,100px"></dc-import></div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
      <span style="font:600 10px/1.2 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C23A68">{{ kicker }}</span>
      <h3 style="margin:0;font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:{{ ts }};line-height:1.16;color:#2A0910;text-wrap:balance">{{ title }}</h3>
      <sc-if value="{{ hasEx }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-family:'Libre Caslon Text',Georgia,serif;font-size:{{ es }};line-height:1.55;color:#5B4248">{{ excerpt }}</p></sc-if>
      <sc-if value="{{ hasBy }}" hint-placeholder-val="{{ false }}"><span style="font:500 11px/1 'Jost',sans-serif;letter-spacing:.06em;color:#7A5F65">{{ byline }}</span></sc-if>
    </div>
  </article>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:460},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sweet Talk&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Situationship Exit Interview&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;excerpt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Closure is a gift you give yourself. Preferably in writing.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;byline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Couple in taxi, city lights&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;,&quot;xl&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;stack&quot;,&quot;row&quot;],&quot;default&quot;:&quot;stack&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ratio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4/3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;blush&quot;,&quot;champ&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;thumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;120px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;noShot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const S = { xl: ['44px', '18px'], lg: ['32px', '17px'], md: ['22px', '15px'], sm: ['18px', '14px'] }[p.size ?? 'md'] || ['22px', '15px'];
    const row = p.layout === 'row';
    return {
      stack: !row, row, ts: S[0], es: S[1],
      kicker: p.kicker ?? '', title: p.title ?? '', excerpt: p.excerpt ?? '', byline: p.byline ?? '', shot: p.shot ?? '',
      ratio: p.ratio ?? (row ? '1' : '4/3'), tone: p.tone ?? 'light', tw: p.thumb ?? '120px',
      hasShot: p.noShot ? false : true, hasEx: !!p.excerpt, hasBy: !!p.byline, hasCta: !!p.cta
    };
  }
}
</script>
</body>
</html>
