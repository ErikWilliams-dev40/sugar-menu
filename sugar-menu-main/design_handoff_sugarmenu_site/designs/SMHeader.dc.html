<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Jost:wght@400..600&display=swap"></helmet>
<header style="background:#3B0D18;color:#FBF7F5">
  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:22px 32px 16px">
    <div></div>
    <a href="#" style="text-align:center;text-decoration:none;color:#FBF7F5">
      <div style="font:800 clamp(40px,5vw,66px)/.9 'Playfair Display',Georgia,serif;letter-spacing:-.025em">SUGARMENU<span style="color:#F2709C">.</span></div>
      <div style="font:italic 500 clamp(18px,2vw,27px)/1 'Playfair Display',Georgia,serif;color:#F2709C;margin-top:6px">Indulge Yourself.</div>
    </a>
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:20px;font:500 11px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase">
      <a href="#" style="color:#FBF7F5">Search</a>
      <a href="#" style="background:#F2709C;color:#2A0910;padding:11px 18px;font-weight:600">Join</a>
      <a href="#" style="color:#FBF7F5">Sign in</a>
    </div>
  </div>
  <nav style="border-top:1px solid rgba(251,247,245,.14);display:flex;justify-content:safe center;gap:clamp(16px,2.2vw,30px);padding:14px 32px 0;overflow-x:auto;scrollbar-width:none">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="10">
      <a href="#" style="font:500 11px/1 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;padding-bottom:13px;text-decoration:none;color:{{ it.col }};border-bottom:2px solid {{ it.bd }}">{{ it.label }}</a>
    </sc-for>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:160},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Eye Candy&quot;,&quot;Sweet Talk&quot;,&quot;Sugar High&quot;,&quot;Sugar Fix&quot;,&quot;The Sweet Spot&quot;,&quot;Sugar Bytes&quot;,&quot;The Sugar Rush&quot;,&quot;GLProud&quot;,&quot;The Sugar Dish&quot;,&quot;Extra Sugar&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NAV = ['Eye Candy','Sweet Talk','Sugar High','Sugar Fix','The Sweet Spot','Sugar Bytes','The Sugar Rush','GLProud','The Sugar Dish','Extra Sugar'];
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? '';
    return { items: NAV.map(l => ({ label: l, col: l === a ? '#F2709C' : '#FBF7F5', bd: l === a ? '#F2709C' : 'transparent' })) };
  }
}
</script>
</body>
</html>
