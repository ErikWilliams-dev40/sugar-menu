<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:{{ h }};min-height:{{ minh }};aspect-ratio:{{ ratio }};background-color:{{ bg }};background-image:repeating-linear-gradient(135deg,{{ st }} 0 1px,transparent 1px 10px);display:flex;align-items:{{ ai }};padding:10px;font:500 9.5px/1.35 ui-monospace,Menlo,monospace;color:{{ fg }};text-transform:uppercase;letter-spacing:.04em;overflow:hidden"><span style="max-width:88%">{{ label }}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:240},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Product shot&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ratio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4/3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;blush&quot;,&quot;champ&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;minh&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pos&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bottom&quot;,&quot;top&quot;],&quot;default&quot;:&quot;bottom&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const T = {
      dark: { bg: '#4A1422', st: 'rgba(242,112,156,.14)', fg: '#F6C3D2' },
      light: { bg: '#EFE3E0', st: 'rgba(59,13,24,.08)', fg: '#7A2B40' },
      blush: { bg: '#F1CBD3', st: 'rgba(59,13,24,.09)', fg: '#6B1A30' },
      champ: { bg: '#E8D8C4', st: 'rgba(59,13,24,.08)', fg: '#5C1A2B' }
    };
    const p = this.props;
    return { ...(T[p.tone] || T.light), ratio: p.ratio ?? 'auto', h: p.h ?? 'auto', minh: p.minh ?? '0px', label: p.label ?? '', ai: p.pos === 'top' ? 'flex-start' : 'flex-end' };
  }
}
</script>
</body>
</html>
