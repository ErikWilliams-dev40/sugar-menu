<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="#" style="display:flex;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(59,13,24,.12);text-decoration:none">
  <span style="flex:none;width:46px;font:italic 400 32px/1 'Playfair Display',Georgia,serif;color:#C23A68">{{ n }}</span>
  <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><span style="font:600 16px/1.25 'Playfair Display',Georgia,serif;color:#2A0910">{{ title }}</span><span style="font:600 9.5px/1 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C23A68">{{ kicker }}</span></span>
  <span style="flex:none;width:80px"><dc-import name="SMPh" ratio="4/3" tone="{{ tone }}" hint-size="80px,60px"></dc-import></span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:90},&quot;n&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Solo Trip That Changed Everything About Me&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sugar High&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;blush&quot;,&quot;champ&quot;],&quot;default&quot;:&quot;blush&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
