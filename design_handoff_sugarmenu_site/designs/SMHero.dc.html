<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes smHeroProg{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style></helmet>
<section style="position:relative;background:#2A0910;color:#FFFDFC;overflow:hidden" onMouseEnter="{{ pause }}" onMouseLeave="{{ resume }}" onTouchStart="{{ touchStart }}" onTouchEnd="{{ touchEnd }}" aria-roledescription="carousel">
  <div style="display:grid">
    <sc-for list="{{ slides }}" as="s" hint-placeholder-count="1">
      <div style="grid-area:1/1;opacity:{{ s.op }};visibility:{{ s.vis }};transition:opacity .9s ease,visibility .9s" aria-hidden="{{ s.hidden }}">
        <sc-if value="{{ s.photo }}" hint-placeholder-val="{{ true }}">
          <div style="position:relative;min-height:560px;background-color:#4A1422;background-image:repeating-linear-gradient(135deg,rgba(242,112,156,.14) 0 1px,transparent 1px 10px)">
            <span style="position:absolute;top:16px;right:18px;max-width:320px;text-align:right;font:500 9.5px/1.4 ui-monospace,Menlo,monospace;color:#F6C3D2;text-transform:uppercase;letter-spacing:.04em">{{ s.shot }}</span>
            <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(42,9,16,.95) 0%,rgba(42,9,16,.78) 40%,rgba(42,9,16,0) 72%)"></div>
            <div style="position:relative;max-width:660px;display:flex;flex-direction:column;gap:20px;padding:64px 56px 110px">
              <span style="font:500 12px/1 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#F6D6DC">{{ s.kicker }}</span>
              <h1 style="margin:0;font:800 clamp(46px,5.4vw,72px)/.92 'Playfair Display',Georgia,serif;text-transform:uppercase;letter-spacing:-.035em;text-wrap:balance">{{ s.l1 }}<em style="display:block;font-style:italic;color:#F2709C">{{ s.l2 }}</em></h1>
              <p style="margin:0;max-width:470px;font:400 19px/1.45 'Libre Caslon Text',Georgia,serif;color:#F3E6E8">{{ s.copy }}</p>
              <a href="#" style="align-self:flex-start;background:#F2709C;color:#2A0910;font:600 12px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:16px 24px">{{ s.cta }} →</a>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ s.split }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:560px;background:#3B0D18">
            <div style="display:flex;flex-direction:column;justify-content:center;gap:20px;padding:56px 48px 110px 56px">
              <span style="font:500 12px/1 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#F6D6DC">{{ s.kicker }}</span>
              <h1 style="margin:0;font:800 clamp(42px,4.6vw,64px)/.92 'Playfair Display',Georgia,serif;text-transform:uppercase;letter-spacing:-.035em;text-wrap:balance">{{ s.l1 }}<em style="display:block;font-style:italic;color:#F2709C">{{ s.l2 }}</em></h1>
              <p style="margin:0;max-width:440px;font:400 18px/1.5 'Libre Caslon Text',Georgia,serif;color:#F3E6E8">{{ s.copy }}</p>
              <a href="#" style="align-self:flex-start;background:#F2709C;color:#2A0910;font:600 12px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:16px 24px">{{ s.cta }} →</a>
            </div>
            <div style="padding:20px 20px 20px 0;display:flex"><dc-import name="SMPh" label="{{ s.shot }}" h="100%" tone="dark" hint-size="100%,520px" style="flex:1"></dc-import></div>
          </div>
        </sc-if>
        <sc-if value="{{ s.cover }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) 340px minmax(0,1fr);align-items:center;gap:36px;min-height:580px;padding:44px 48px 100px;background:#3B0D18">
            <div style="display:flex;flex-direction:column;gap:18px;align-items:flex-end;text-align:right">
              <span style="font:500 12px/1 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#F6D6DC">{{ s.n }} — {{ s.kicker }}</span>
              <h1 style="margin:0;font:800 clamp(40px,4.4vw,62px)/.92 'Playfair Display',Georgia,serif;text-transform:uppercase;letter-spacing:-.035em;text-wrap:balance">{{ s.l1 }}</h1>
            </div>
            <div style="background:#FFFDFC;padding:10px 10px 34px;transform:rotate(-2deg);box-shadow:0 20px 50px rgba(0,0,0,.35)"><dc-import name="SMPh" label="{{ s.shot }}" ratio="4/5" tone="dark" hint-size="320px,400px"></dc-import></div>
            <div style="display:flex;flex-direction:column;gap:18px">
              <div style="font:italic 800 clamp(40px,4.4vw,62px)/.92 'Playfair Display',Georgia,serif;text-transform:uppercase;letter-spacing:-.035em;color:#F2709C;text-wrap:balance">{{ s.l2 }}</div>
              <p style="margin:0;max-width:360px;font:400 17px/1.5 'Libre Caslon Text',Georgia,serif;color:#F3E6E8">{{ s.copy }}</p>
              <a href="#" style="align-self:flex-start;background:#F2709C;color:#2A0910;font:600 12px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:16px 24px">{{ s.cta }} →</a>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:30px;z-index:3;display:flex;align-items:center;gap:22px;padding:0 56px;justify-content:{{ cj }}">
    <div style="display:flex;gap:18px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
        <button onClick="{{ t.go }}" aria-label="{{ t.aria }}" style="background:none;border:0;padding:0 0 6px;cursor:pointer;font:500 12px/1 'Jost',sans-serif;letter-spacing:.06em;color:{{ t.col }};border-bottom:2px solid {{ t.bd }}">{{ t.n }}</button>
      </sc-for>
    </div>
    <div style="width:90px;height:2px;background:rgba(255,253,252,.25);overflow:hidden">{{ bar }}</div>
    <div style="display:flex;gap:6px">
      <button onClick="{{ prev }}" aria-label="Previous slide" style="width:36px;height:36px;background:none;border:1px solid rgba(255,253,252,.35);color:#FFFDFC;font:400 16px/1 'Jost',sans-serif;cursor:pointer">‹</button>
      <button onClick="{{ next }}" aria-label="Next slide" style="width:36px;height:36px;background:none;border:1px solid rgba(255,253,252,.35);color:#FFFDFC;font:400 16px/1 'Jost',sans-serif;cursor:pointer">›</button>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:580},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;photo&quot;,&quot;split&quot;,&quot;cover&quot;],&quot;default&quot;:&quot;photo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;interval&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:4,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;},&quot;start&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
const SLIDES = [
  { n: '01', kicker: 'A brighter chapter awaits.', l1: 'The old you called.', l2: 'We sent her to voicemail.', copy: 'New places. New experiences. New possibilities. Some calls just aren’t worth taking.', cta: 'Start your next chapter', shot: 'Pink coupe, cherries, passport, “Good Girls Book Bigger Trips” luggage tag, city at dusk' },
  { n: '02', kicker: 'Go somewhere better.', l1: 'Your comfort zone? Adorable.', l2: 'Now leave it.', copy: 'Better stories rarely start with staying home. There’s a whole world on the menu.', cta: 'Plan the escape', shot: 'Coastal balcony at sunset, spritz, tortoiseshell sunglasses, blush luggage' },
  { n: '03', kicker: 'A bolder era begins.', l1: 'It’s not a comeback.', l2: 'It’s a takeover.', copy: 'A brighter life. Bigger plans. Better taste. This is your era now.', cta: 'Explore the takeover', shot: 'Champagne, stacked books, sunglasses, quilted burgundy bag, skyline lights' },
  { n: '04', kicker: 'Indulge a little.', l1: 'Good taste.', l2: 'Questionable decisions. Great stories.', copy: 'The best nights, best trips and best stories rarely come with an instruction manual.', cta: 'Get the stories', shot: 'Martini, lipstick, candlelight, “Meet me here” matchbook on marble' },
  { n: '05', kicker: 'No more waiting around.', l1: 'A little more pleasure.', l2: 'A lot less permission.', copy: 'Go. Stay. Splurge. Change your mind. You don’t need a permission slip to enjoy your life.', cta: 'Indulge yourself', shot: 'Velvet, perfume, “Suite 505” key tag, pink cocktail, travel snapshot' }
];
class Component extends DCLogic {
  state = { i: this.props.start ?? 0, paused: false };
  go(n) { this.setState({ i: (n + 5) % 5 }); }
  renderVals() {
    const { i, paused } = this.state;
    const v = this.props.variant ?? 'photo';
    const auto = this.props.autoplay ?? true;
    const sec = this.props.interval ?? 7;
    const bar = auto
      ? React.createElement('div', { key: 'p' + i + sec, onAnimationEnd: () => this.go(i + 1), style: { height: 2, background: '#F2709C', transformOrigin: 'left', animation: `smHeroProg ${sec}s linear forwards`, animationPlayState: paused ? 'paused' : 'running' } })
      : React.createElement('div', { style: { height: 2, width: ((i + 1) / 5 * 100) + '%', background: '#F2709C' } });
    return {
      slides: SLIDES.map((s, k) => ({ ...s, op: k === i ? 1 : 0, vis: k === i ? 'visible' : 'hidden', hidden: k === i ? 'false' : 'true', photo: v === 'photo', split: v === 'split', cover: v === 'cover' })),
      tabs: SLIDES.map((s, k) => ({ n: s.n, aria: 'Slide ' + s.n, go: () => this.go(k), col: k === i ? '#FFFDFC' : 'rgba(255,253,252,.62)', bd: k === i ? '#F2709C' : 'transparent' })),
      cj: v === 'cover' ? 'center' : 'flex-start',
      bar, prev: () => this.go(i - 1), next: () => this.go(i + 1),
      pause: () => this.setState({ paused: true }), resume: () => this.setState({ paused: false }),
      touchStart: e => { this.tx = e.touches[0].clientX; },
      touchEnd: e => { const d = e.changedTouches[0].clientX - (this.tx ?? 0); if (Math.abs(d) > 50) this.go(i + (d < 0 ? 1 : -1)); }
    };
  }
}
</script>
</body>
</html>
