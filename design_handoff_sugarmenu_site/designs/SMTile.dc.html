<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="#" style="display:flex;flex-direction:column;height:100%;background:#FFFDFC;border:1px solid rgba(59,13,24,.08);text-decoration:none">
  <div style="position:relative">
    <dc-import name="SMPh" label="{{ shot }}" ratio="4/3" tone="dark" pos="top" hint-size="100%,170px"></dc-import>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:34px 14px 10px;background:linear-gradient(to top,rgba(42,9,16,.9),rgba(42,9,16,0));font:600 24px/1 'Playfair Display',Georgia,serif;text-transform:uppercase;letter-spacing:-.015em;color:#FFFDFC">{{ name }}<em style="font-style:italic;color:#F2709C;text-transform:none">{{ em }}</em></div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:9px;padding:14px 14px 16px">
    <span style="font:600 9.5px/1.3 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#C23A68">{{ sub }}</span>
    <sc-if value="{{ hasDesc }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font:400 13.5px/1.5 'Libre Caslon Text',Georgia,serif;color:#5B4248">{{ desc }}</p></sc-if>
    <sc-if value="{{ hasLatest }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font:italic 500 16px/1.3 'Playfair Display',Georgia,serif;color:#2A0910">{{ latest }}</p></sc-if>
    <span style="margin-top:auto;padding-top:6px;font:600 10.5px/1 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C23A68">Explore →</span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:340},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Eye Candy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;em&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fashion. Beauty. Style.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Statement looks. Effortless glam.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;latest&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lipsticks on red satin&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { name: p.label ?? '', em: p.em ?? '', sub: p.sub ?? '', desc: p.desc ?? '', latest: p.latest ?? '', shot: p.shot ?? '', hasDesc: !!p.desc && !p.latest, hasLatest: !!p.latest };
  }
}
</script>
</body>
</html>
